[project]
name = "lsttranslate"
version = "0.1.0"
description = "Windows 屏幕翻译工具，多引擎竞速翻译"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "jiter>=0.17",
    "pydantic>=2.14,<3",
    "ctranslate2>=4.8,<5",
    "sentencepiece>=0.2",
    "lingua-language-detector>=2.2",
    "tomlkit>=0.15",
    "keyring>=25.7",
    "PySide6-Essentials>=6.12,<6.13",
    "qasync>=0.28",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-qt",
    "hypothesis",
    "basedpyright",
    "import-linter",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
# 每个测试的上限。推理进程测试会启动真实子进程，一旦死锁，测试在这里失败而不是挂住整个运行。
timeout = 60

[tool.basedpyright]
include = ["lst", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportPrivateUsage = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

# 模块依赖规则，对应架构文档 4.2 节。
[tool.importlinter]
root_package = "lst"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "分层：app → ui | services → kernel → contracts"
type = "layers"
layers = [
    "lst.app",
    "lst.ui | lst.services",
    "lst.kernel",
    "lst.contracts",
]

[[tool.importlinter.contracts]]
name = "子进程入口只依赖 contracts"
type = "forbidden"
source_modules = ["lst.workers"]
forbidden_modules = ["lst.kernel", "lst.services", "lst.ui", "lst.app"]

[[tool.importlinter.contracts]]
name = "业务层与内核不依赖 Qt"
type = "forbidden"
source_modules = ["lst.contracts", "lst.kernel", "lst.services"]
forbidden_modules = ["PySide6"]

[[tool.importlinter.contracts]]
name = "业务模块互不依赖"
type = "independence"
modules = [
    "lst.services.race",
    "lst.services.engines",
    "lst.services.ocr",
    "lst.services.config",
    "lst.services.cache",
    "lst.services.stats",
    "lst.services.models",
    "lst.services.diagnostics",
]

[[tool.importlinter.contracts]]
name = "界面模块互不依赖（ui.theme、ui.i18n 为共用模块，不在此列）"
type = "independence"
modules = [
    "lst.ui.hotkeys",
    "lst.ui.tray",
    "lst.ui.capture",
    "lst.ui.overlay",
    "lst.ui.bilingual",
    "lst.ui.settings",
    "lst.ui.onboarding",
]
